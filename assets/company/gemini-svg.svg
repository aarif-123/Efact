<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="100%" height="100%">
  <defs>
    <!-- Dark Blue to Cyan Gradient for the Emblem -->
    <linearGradient id="emblemGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06294d" />
      <stop offset="50%" stop-color="#006699" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Cyan Radial Gradient for Joint Circles -->
    <radialGradient id="jointGradient" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0088cc" />
    </radialGradient>

    <!-- Gradient for Tagline Accent (Effect) -->
    <linearGradient id="taglineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bcd4" />
      <stop offset="100%" stop-color="#00838f" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- 1. MAIN EMBLEM BACKGROUND (Styled Letter 'E') -->
    <path fill="url(#emblemGradient)" d="
      M 160 10 
      L 310 10 
      Q 350 10, 310 50 
      L 150 90 
      Q 130 95, 140 105 
      L 290 105 
      Q 320 105, 300 135 
      L 170 175 
      Q 150 180, 160 190 
      L 310 270 
      L 10 270 
      Q 0 270, 10 240 
      L 110 30 
      Q 125 10, 160 10 Z" />

    <!-- 2. ROBOTIC ARM OVERLAY (White Structure) -->
    <!-- Base Joint (Bottom Left) -->
    <circle cx="80" cy="220" r="40" fill="#ffffff" />
    <circle cx="80" cy="220" r="28" fill="url(#jointGradient)" />
    <circle cx="80" cy="220" r="22" stroke="#06294d" stroke-width="2" fill="none" />

    <!-- Lower Arm Segment -->
    <path fill="#ffffff" d="M 68 188 L 128 118 L 152 138 L 92 208 Z" />

    <!-- Middle Joint -->
    <circle cx="140" cy="128" r="30" fill="#ffffff" />
    <circle cx="140" cy="128" r="20" fill="url(#jointGradient)" />
    <circle cx="140" cy="128" r="15" stroke="#06294d" stroke-width="1.5" fill="none" />

    <!-- Upper Arm Segment -->
    <path fill="#ffffff" d="M 158 112 L 238 182 L 218 202 L 138 132 Z" />

    <!-- Gripper / Wrench End (Bottom Right) -->
    <path fill="#ffffff" d="
      M 220 170 
      L 255 200 
      C 275 190, 285 210, 275 230 
      L 255 250 
      L 230 225 
      C 238 220, 238 210, 230 205 
      L 205 185 Z" />
  </g>

  <!-- 3. TEXT: EFACT -->
  <g fill="#0b2545">
    <!-- E -->
    <path d="M 370 70 H 450 V 95 H 400 V 120 H 440 V 145 H 400 V 170 H 450 V 195 H 370 Q 360 195 360 185 V 80 Q 360 70 370 70 Z" />
    <!-- F -->
    <path d="M 470 70 H 550 V 95 H 500 V 120 H 540 V 145 H 500 V 195 H 470 Q 460 195 460 185 V 80 Q 460 70 470 70 Z" />
    <!-- A -->
    <path d="M 580 70 H 620 Q 630 70 635 80 L 670 195 H 635 L 625 160 H 575 L 565 195 H 530 L 565 80 Q 570 70 580 70 Z M 600 95 L 583 140 H 617 Z" />
    <!-- C -->
    <path d="M 710 70 H 760 Q 770 70 770 80 V 95 H 740 V 95 Q 710 95 710 132 Q 710 170 740 170 H 770 V 185 Q 770 195 760 195 H 710 Q 680 195 680 132 Q 680 70 710 70 Z" />
    <!-- T -->
    <path d="M 780 70 H 880 V 95 H 845 V 185 Q 845 195 835 195 H 825 Q 815 195 815 185 V 95 H 780 Z" />
  </g>

  <!-- 4. TEXT: ROBOTICS -->
  <g fill="none" stroke="#0b2545" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- R -->
    <path d="M 370 230 V 270 M 370 230 H 400 C 415 230, 415 250, 400 250 H 370 M 395 250 L 415 270" />
    <!-- O -->
    <rect x="445" y="230" width="45" height="40" rx="10" />
    <!-- B -->
    <path d="M 515 230 V 270 M 515 230 H 540 C 550 230, 550 248, 540 248 H 515 H 542 C 555 248, 555 270, 542 270 H 515" />
    <!-- O -->
    <rect x="580" y="230" width="45" height="40" rx="10" />
    <!-- T -->
    <path d="M 650 230 H 695 M 672 230 V 270" />
    <!-- I -->
    <path d="M 725 230 V 270" />
    <!-- C -->
    <path d="M 785 230 H 760 C 750 230, 750 270, 760 270 H 785" />
    <!-- S -->
    <path d="M 845 235 C 845 230, 815 230, 815 245 C 815 260, 845 255, 845 265 C 845 275, 815 275, 815 268" />
  </g>

  <!-- 5. TAGLINE: Making Every Effect Count -->
  <g transform="translate(70, 310)" font-family="sans-serif" font-style="italic" font-weight="600" font-size="28">
    <text x="0" y="25" fill="#0b2545">Making</text>
    <text x="110" y="25" fill="#0b2545">Every</text>
    <text x="195" y="25" fill="#00bcd4">Effect</text>
    <text x="285" y="25" fill="#0b2545">Count</text>
    
    <!-- Curved Underline Sweep -->
    <path d="M 190 35 Q 260 48 340 32" fill="none" stroke="url(#taglineGradient)" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>